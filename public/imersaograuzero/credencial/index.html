<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Credencial · Imersão Grau Zero</title>
<link rel="icon" href="/assets/favicon.png">
<style>
/* ============================================================================
   QR da credencial — Imersão Grau Zero

   O código impresso no verso da credencial aponta para este endereço e não
   muda mais. O que ele abre é lido do banco (tabela qr_links, editada em
   /admin/ → QR da credencial): ou redireciona direto para um destino, ou
   vira este menu. Sem banco, sem rede ou sem config, o menu de reserva
   (PADRAO, no script) garante que o QR nunca cai num beco.

   Paleta e fonte são as da página da Imersão (/imersaograuzero/), inclusive o
   arquivo da Cinzel, que vem de /imersaograuzero/assets/fonts/: no 4G do
   evento nada aqui depende de CDN. Caminhos absolutos porque a página também
   é servida sem a barra final (/imersaograuzero/credencial).
   ========================================================================= */
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 600;font-display:swap;
  src:url("/imersaograuzero/assets/fonts/cinzel-latin.woff2") format('woff2')}

:root{
  --gold:#d89d4d;--gold-deep:#c78039;--gold-light:#e6bd74;
  --ink:#0a0a0a;--paper:#f5f0e6;--muted:rgba(245,240,230,.62);
  --line:rgba(216,157,77,.22);--glass:rgba(255,255,255,.035);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center}
a{color:inherit}

/* fundo: dois orbes dourados à deriva + grade sutil, como na página da Imersão */
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.55}
.orb-a{width:60vmax;height:60vmax;left:-25vmax;top:-30vmax;
  background:radial-gradient(circle,rgba(216,157,77,.34),transparent 60%);animation:drift1 22s ease-in-out infinite}
.orb-b{width:50vmax;height:50vmax;right:-22vmax;bottom:-26vmax;
  background:radial-gradient(circle,rgba(199,128,57,.26),transparent 60%);animation:drift2 26s ease-in-out infinite}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(245,240,230,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(245,240,230,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%)}

.wrap{position:relative;z-index:1;width:100%;max-width:460px;
  padding:max(28px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

.top{text-align:center;padding:22px 0 26px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.3em;
  color:var(--gold);font-weight:600}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--gold);opacity:.6}

/* o anel: gira enquanto consulta o banco; parado vira emblema */
.ring{width:72px;height:72px;margin:26px auto 20px;border-radius:50%;position:relative;
  border:1px solid var(--line)}
.ring::before{content:"";position:absolute;inset:-1px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--gold);border-right-color:rgba(216,157,77,.35);
  animation:spin 1.1s linear infinite}
.ring-in{position:absolute;inset:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold-deep) 70%);
  box-shadow:0 0 30px rgba(216,157,77,.35);opacity:.9}
.ring-in svg{position:absolute;inset:0;margin:auto;width:22px;height:22px;stroke:var(--ink);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.pronto .ring::before{animation:none;border-color:var(--line);border-top-color:var(--gold)}

h1{font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:27px;line-height:1.15;margin:0;
  letter-spacing:.02em;color:var(--paper)}
.sub{margin:10px auto 0;max-width:34ch;color:var(--muted);font-size:14.5px;line-height:1.55}

/* menu */
.lista{display:flex;flex-direction:column;gap:10px;margin:0}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px 15px 15px;border-radius:16px;
  text-decoration:none;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .2s,transform .2s,background .2s;
  opacity:0;transform:translateY(16px);animation:reveal .7s cubic-bezier(.16,.7,.2,1) forwards;
  animation-delay:calc(var(--i) * 70ms)}
.item:hover,.item:focus-visible{border-color:var(--gold);background:rgba(216,157,77,.07);outline:none}
.item:active{transform:translateY(1px)}
.item-ic{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(216,157,77,.08);color:var(--gold-light)}
.item-ic svg,.item-chev svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.item-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item-t{font-size:15.5px;font-weight:600;letter-spacing:.005em}
.item-s{font-size:13px;color:var(--muted);line-height:1.4}
.item-chev{color:rgba(245,240,230,.35);display:grid;place-items:center}

/* redirecionando */
.manual{text-align:center;color:var(--muted);font-size:13.5px;margin:18px 0 0}
.manual a{color:var(--gold-light);text-decoration:underline;text-underline-offset:3px}

.foot{margin-top:auto;padding-top:34px;text-align:center;display:flex;flex-direction:column;gap:6px}
.mark{font-family:'Cinzel',Georgia,serif;font-size:12.5px;letter-spacing:.3em;color:var(--paper);opacity:.8}
.mark b{font-weight:600;color:var(--gold)}
.foot-s{font-size:11.5px;letter-spacing:.14em;color:rgba(245,240,230,.4);text-transform:uppercase}

[hidden]{display:none !important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reveal{to{opacity:1;transform:none}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6%,8%)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-7%,-6%)}}
@media (prefers-reduced-motion:reduce){
  .orb,.ring::before{animation:none}
  .item{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="grid"></div>

<main class="wrap">
  <header class="top">
    <div class="eyebrow">IMERSÃO GRAU ZERO</div>
    <div class="ring" aria-hidden="true"><div class="ring-in">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </div></div>
    <h1 id="titulo">Um instante…</h1>
    <p class="sub" id="sub">Abrindo a sua credencial.</p>
  </header>

  <nav class="lista" id="lista" aria-label="Links da credencial" hidden></nav>

  <p class="manual" id="manual" hidden>Se não abrir sozinho, <a id="manualLink" href="#">toque aqui</a>.</p>

  <footer class="foot">
    <span class="mark">OFTALMO <b>BLACK</b></span>
    <span class="foot-s">Outubro de 2026</span>
  </footer>
</main>

<!-- A mesma config da área de membros: URL do projeto e chave publishable.
     Regerada no boot do container a partir das variáveis de ambiente. -->
<script src="/config.js"></script>
<script>
(function () {
  'use strict';

  var SLUG = 'credencial';

  /* Quem chega pelo QR é contado à parte nos relatórios de quem recebe o
     link. Não entra em WhatsApp, Maps, redes e Drive: lá o parâmetro é ruído
     e em alguns casos quebra o link curto. */
  var UTM = 'utm_source=credencial&utm_medium=qrcode&utm_campaign=imersao_grau_zero_out26';
  var SEM_UTM = /(^|\.)(wa\.me|whatsapp\.com|goo\.gl|google\.com|instagram\.com|youtube\.com|youtu\.be|drive\.google\.com|photos\.google\.com|photos\.app\.goo\.gl)$/i;

  /* O menu de reserva. Aparece se o banco não responder em tempo, se a tabela
     ainda não existir ou se a lista voltar vazia. O WhatsApp é o mesmo da
     página da Imersão. */
  var PADRAO = [
    { titulo: 'Falar com a equipe',
      descricao: 'Dúvida, programação ou qualquer coisa durante o evento.',
      url: 'https://wa.me/5592914418889', icone: 'whatsapp' },
    { titulo: 'Imersão Grau Zero',
      descricao: 'A página oficial do evento.',
      url: 'https://oftalmoblack.com.br/imersaograuzero/', icone: 'link' }
  ];

  /* Traço Feather, o mesmo do painel. A chave é o que vai na coluna `icone`. */
  var ICONES = {
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    whatsapp: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M8.6 8.2c.2-.5.4-.5.6-.5h.5c.2 0 .4 0 .6.5l.7 1.7c.1.2.1.4 0 .6l-.4.5c-.1.2-.2.3 0 .6a6 6 0 0 0 2.8 2.4c.3.1.4 0 .6-.1l.5-.6c.2-.2.3-.2.5-.1l1.6.8c.2.1.4.2.4.4v.5c0 .5-.4 1.1-.7 1.3-.4.3-1 .5-1.6.4a9 9 0 0 1-5.6-3.6c-.7-1-1.1-2-1.1-2.9 0-.6.2-1.2.6-1.4z"/>',
    'map-pin': '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    award: '<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'file-text': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
    gift: '<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
    coffee: '<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
    instagram: '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
    chevron: '<polyline points="9 18 15 12 9 6"/>'
  };

  var cfg = window.CLUB_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  /* ?menu na URL força a lista mesmo com um redirect vigente — é como o
     admin confere o menu sem sair da página. */
  var forcarMenu = /[?&]menu(=|&|$)/.test(location.search);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function svg(chave) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONES[chave] || ICONES.link) + '</svg>';
  }

  function api(caminho, opts) {
    opts = opts || {};
    var h = { apikey: cfg.supabaseAnonKey, Authorization: 'Bearer ' + cfg.supabaseAnonKey };
    if (opts.body) { h['Content-Type'] = 'application/json'; h.Prefer = 'return=minimal'; }
    return fetch(cfg.supabaseUrl + '/rest/v1/' + caminho, {
      method: opts.body ? 'POST' : 'GET',
      headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: opts.signal,
      /* keepalive: o registro do scan sobrevive à navegação que vem logo
         depois dele. */
      keepalive: !!opts.body
    });
  }

  function vigente(r, agora) {
    return (!r.inicio || new Date(r.inicio) <= agora) &&
           (!r.fim    || new Date(r.fim)    >= agora);
  }

  function comUtm(url) {
    try {
      var u = new URL(url);
      if (SEM_UTM.test(u.hostname) || /utm_/.test(u.search)) return url;
      u.search += (u.search ? '&' : '?') + UTM;
      return u.toString();
    } catch (e) { return url; }
  }

  /* Falhar aqui não pode atrapalhar ninguém: o scan é estatística. */
  function registrar(modo, r) {
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return Promise.resolve();
    return api('qr_scans', { body: {
      slug: SLUG, modo: modo,
      link_id: r && r.id ? r.id : null,
      destino: r ? String(r.url).slice(0, 2000) : null,
      ua: String(navigator.userAgent || '').slice(0, 400)
    } }).catch(function () {});
  }

  function carregar() {
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return Promise.reject(new Error('sem config'));
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    /* 4G de evento lotado: se em 4,5 s não veio, vale o menu de reserva. */
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 4500);
    return api('qr_links?slug=eq.' + SLUG + '&ativo=is.true' +
               '&order=ordem.asc,criado_em.asc' +
               '&select=id,titulo,descricao,url,icone,redirecionar,inicio,fim',
               { signal: ctl && ctl.signal })
      .then(function (res) {
        clearTimeout(t);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
  }

  function botao(r, i) {
    return '<a class="item" style="--i:' + i + '" href="' + esc(comUtm(r.url)) + '"' +
      (r.id ? ' data-id="' + esc(r.id) + '"' : '') + '>' +
      '<span class="item-ic">' + svg(r.icone) + '</span>' +
      '<span class="item-tx"><span class="item-t">' + esc(r.titulo) + '</span>' +
        (r.descricao ? '<span class="item-s">' + esc(r.descricao) + '</span>' : '') +
      '</span>' +
      '<span class="item-chev">' + svg('chevron') + '</span>' +
    '</a>';
  }

  function menu(rows) {
    $('titulo').textContent = 'Sua credencial';
    $('sub').textContent = 'Tudo que você precisa durante a imersão, num toque.';
    $('lista').innerHTML = rows.map(botao).join('');
    $('lista').hidden = false;
    document.body.classList.add('pronto');
  }

  function redirecionar(r) {
    var destino = comUtm(r.url);
    $('titulo').textContent = r.titulo;
    $('sub').textContent = 'Abrindo…';
    $('manualLink').href = destino;
    $('manual').hidden = false;
    var ir = function () { location.replace(destino); };
    /* Dispara o registro e vai; não espera mais que um piscar por ele. */
    Promise.race([registrar('redirect', r), new Promise(function (ok) { setTimeout(ok, 250); })])
      .then(ir, ir);
  }

  $('lista').addEventListener('click', function (e) {
    var a = e.target.closest('a.item');
    if (!a || !a.dataset.id) return;
    registrar('clique', { id: a.dataset.id, url: a.href });
  });

  carregar().then(function (rows) {
    var agora = new Date();
    var vig = (rows || []).filter(function (r) { return vigente(r, agora); });
    var alvo = forcarMenu ? null : vig.filter(function (r) { return r.redirecionar; })[0];
    if (alvo) return redirecionar(alvo);
    menu(vig.length ? vig : PADRAO);
    registrar('menu', null);
  }).catch(function () {
    menu(PADRAO);
  });
})();
</script>
</body>
</html>

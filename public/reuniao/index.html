<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Oftalmológica Premium</title>
<script>
(function(){
  /* Split A/B do workshop 01/10 (decisão Felipe 18/09/2026): 50/50 sorteado uma vez por aparelho e
     persistido em localStorage ob_ab ('a' = /workshop/, 'b' = /workshop-b/). ?v=a|b força a variante
     (QA e links diretos) e também grava. Query preservada; UTM de stories como padrão. */
  var q = new URLSearchParams(window.location.search);
  var KEY = 'ob_ab', v = String(q.get('v') || '').toLowerCase();
  if (v !== 'a' && v !== 'b') { try { v = String(localStorage.getItem(KEY) || ''); } catch (e) { v = ''; } }
  if (v !== 'a' && v !== 'b') { v = Math.random() < 0.5 ? 'a' : 'b'; }
  try { localStorage.setItem(KEY, v); } catch (e) {}
  q.delete('v');
  var alvo = v === 'b' ? '/workshop-b/' : '/workshop/';
  var def = { utm_source: 'ig', utm_medium: 'stories', utm_campaign: 'workshop-0110', utm_content: 'link-curto' };
  if (q.has('c') && !q.has('utm_content')) { q.set('utm_content', q.get('c')); q.delete('c'); }
  Object.keys(def).forEach(function(k){ if (!q.has(k)) q.set(k, def[k]); });
  window.location.replace(alvo + '?' + q.toString() + (window.location.hash || ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/workshop/?utm_source=ig&utm_medium=stories&utm_campaign=workshop-0110&utm_content=link-curto"></noscript>

</body>

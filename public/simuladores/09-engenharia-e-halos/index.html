<div class="viz-controls">
<label class="form-label">Comparação<select class="form-select" id="eh-case"><option value="trifocal">Partilhas Gemetric / Plus · imagens genéricas</option><option value="phase" selected>Adição fixa: bifocal +4 × fase ajustada +4</option><option value="zone">Abertura: difração total × zona central</option><option value="gemetric">Gemetric × Gemetric Plus · dados ópticos</option></select></label>

 const ctx=cv.getContext('2d'),im=ctx.createImageData(D.size,D.size),bg=rgb('--background'),fg=rgb('--foreground'),lum=c=>.2126*c[0]+.7152*c[1]+.0722*c[2],dark=lum(bg)<lum(fg)?bg:fg,bright=lum(bg)>lum(fg)?bg:fg,neg=rgb('--viz-series-1'),pos=rgb('--viz-series-2');

function differenceView(){

function waves(box,key){const w=Math.max(280,box.getBoundingClientRect().width),count=(kind.value==='zone'||kind.value==='trifocal')&&pupil.value==='5'?7:6,sy=75+count*35+12,h=sy+70,svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'Contribuições agrupadas por posição no ciclo do perfil, com amplitudes e fases na mesma escala entre os painéis, seguidas da soma coerente no ponto observado.'});box.append(svg);const add=(t,a,txt)=>svg.append(el(t,a,txt)),p=+point.value,c=D.contrib[key][p],t=2*Math.PI*(+time.value),pair=modelPair(),bandScale=Math.max(...pair.flatMap(id=>D.contrib[id+'-'+pupil.value][p].map(v=>Math.hypot(...v))));add('text',{x:4,y:18},p===0?'P · centro da imagem':'H · a 0,050 mm do centro');add('text',{x:4,y:43},'Ciclos →');for(let j=0;j<18;j++){const x1=80+(w-90)*j/18,x2=80+(w-90)*(j+1)/18;add('rect',{x:x1,y:32,width:x2-x1+.2,height:11,fill:`var(--viz-series-${j%6+1})`});}let re=0,im=0;c.forEach((a,j)=>{re+=a[0];im+=a[1];if(j>=count)return;const yy=75+j*35;add('text',{x:4,y:yy+4},j===6?'Periferia':'Trecho '+(j+1));add('line',{x1:64,y1:yy,x2:w-10,y2:yy,stroke:'var(--border)'});let d='';for(let n=0;n<=180;n++){const angle=4*Math.PI*n/180-t,y=yy-13*(a[0]*Math.cos(angle)+a[1]*Math.sin(angle))/bandScale,x=68+(w-80)*n/180;d+=(n?'L':'M')+x.toFixed(2)+','+y.toFixed(2);}add('path',{d,fill:'none',stroke:j===6?'var(--foreground)':`var(--viz-series-${j+1})`,'stroke-width':1.6});});add('text',{x:4,y:sy+4},'Soma');add('line',{x1:64,y1:sy,x2:w-10,y2:sy,stroke:'var(--border)'});let d='';for(let n=0;n<=180;n++){const a=4*Math.PI*n/180-t,x=68+(w-80)*n/180,y=sy-23*(re*Math.cos(a)+im*Math.sin(a))/D.waveRef[p];d+=(n?'L':'M')+x.toFixed(2)+','+y.toFixed(2);}add('path',{d,fill:'none',stroke:'var(--foreground)','stroke-width':2});add('text',{x:w-10,y:sy+43,'text-anchor':'end'},'Tempo →');add('text',{x:4,y:h-3},'Mesma escala entre os dois painéis');}
function bars(box,values){const w=Math.max(280,box.getBoundingClientRect().width),h=254,svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'Três percentuais publicados para pupila de 3 milímetros e um complemento aritmético não reportado pela fonte.'});box.append(svg);const add=(t,a,txt)=>svg.append(el(t,a,txt)),labels=['Longe','Intermediário','Perto','Complemento aritmético*'];values.forEach((v,j)=>{const y=32+j*53;add('text',{x:4,y:y-9},labels[j]);add('text',{x:w-8,y:y-9,'text-anchor':'end'},v.toFixed(1).replace('.',',')+'%');add('rect',{x:4,y,width:w-12,height:15,fill:'var(--muted)',opacity:.45});add('rect',{x:4,y,width:(w-12)*v/100,height:15,fill:j<3?`var(--viz-series-${j+1})`:'var(--muted-foreground)',opacity:j<3?.8:.55});});add('text',{x:4,y:251},'Abertura de 3 mm · escala de 0 a 100%');}
function draw(){if(!ready)return;const doc=kind.value==='gemetric',wave=!doc&&view.value==='waves';root.querySelector('#eh-pupil-label').hidden=doc;root.querySelector('#eh-view-label').hidden=doc;root.querySelector('#eh-log-label').hidden=doc||wave||view.value!=='full';root.querySelector('#eh-diff-label').hidden=doc||wave;root.querySelector('#eh-point-controls').hidden=!wave;root.querySelector('#eh-time-controls').hidden=!wave;root.querySelector('#eh-source').hidden=!(doc||kind.value==='trifocal');
const ids=modelPair(),titles=doc?['Gemetric · dados publicados','Gemetric Plus · dados publicados']:kind.value==='trifocal'?['Modelo A · alvo Gemetric','Modelo B · alvo Gemetric Plus']:kind.value==='phase'?['Bifocal +4 D · genérica','Fase ajustada +4 D · genérica']:['Difração em toda a abertura','Difração só no centro · 3,2 mm'];
['a','b'].forEach((side,index)=>{root.querySelector('#eh-title-'+side).textContent=titles[index];const box=root.querySelector('#eh-'+side),vals=root.querySelector('#eh-values-'+side);box.replaceChildren();if(doc){bars(box,index===0?[50.8,17.3,21.8,10.1]:[39.2,16.9,32.8,11.1]);vals.textContent='Adições iguais: +1,75 D / +3,50 D';return;}const id=ids[index],key=id+'-'+pupil.value;energyBars(box,D.energy[key]);if(wave)waves(box,key);else image(box,key);phasePlot(box,id);const E=D.energy[key];vals.textContent='Centro: raio até 0,010 mm.';const ring=document.createElement('div');ring.textContent='Anel: de 0,010 a 0,300 mm.';vals.append(ring);if(kind.value==='phase'){const modes=document.createElement('div');modes.textContent='Perfil periódico · ordem 0: '+pct(D.modal[id][0])+' · ordem +1: '+pct(D.modal[id][1]);vals.append(modes);}if(kind.value==='trifocal'){const f=D.focalShare[id],modes=document.createElement('div'),ratio=document.createElement('div');ratio.textContent='Energia no anel / centro: '+(E.halo/E.core).toFixed(2).replace('.',',')+'×';modes.textContent='Partilha do perfil genérico · longe '+pct(f[0])+' · interm. '+pct(f[1])+' · perto '+pct(f[2]);vals.append(ratio,modes);}});
root.querySelector('#eh-state').textContent=doc?'Mesmas adições e zona central; distribuições diferentes. Estes dados não determinam o desenho exato do halo.':kind.value==='trifocal'?'Imagens de máscaras genéricas no foco de longe. Partilhas aproximadas; não reproduzem Gemetric ou Gemetric Plus.':kind.value==='phase'?'Adição mantida em +4 D: o ajuste de fase favorece o centro e reduz a energia ao redor, com menor parcela na componente de perto.':pupil.value==='3'?'Pupila de 3 mm: cabe inteira na zona central de 3,2 mm. Os dois modelos são iguais.':'Pupila de 5 mm: a periferia refrativa acrescenta contribuição para longe; a zona difrativa continua com 3,2 mm.';
root.querySelector('#eh-scope').textContent=doc?'Três percentuais publicados para abertura de 3 mm. *Complemento de 100%: cálculo aritmético, não reportado pela fonte; denominador não esclarecido. Não significa absorção ou energia medida fora dos focos. Sem imagens das lentes comerciais.':'Modelo ideal · luz de 550 nm · mesma luz total, pupila, exposição e realce · campo retiniano ±'+mm(settings().half)+' mm. Escala retiniana ilustrativa: 0,30 mm por grau; dimensões reais variam entre olhos. A energia no anel é uma métrica óptica, não uma previsão de sintomas. Modelos genéricos: não reproduzem Odyssey, Gemetric ou Gemetric Plus.';
updateDelta(ids,doc);differenceView();root.querySelector('#eh-view-note').hidden=doc||wave;root.querySelector('#eh-view-note').textContent=view.value==='full'?'Campo completo e realce idênticos nos dois painéis.':'Halo ampliado · campo ±0,30 mm · ganho linear comum de 1.000×. Núcleo saturado pelo realce; compare a luz ao redor e as barras.';
if(kind.value==='trifocal')root.querySelector('#eh-scope').textContent+=' Adições do modelo: +1,75 / +3,50 D; zona central de 3,2 mm e periferia refrativa. Partilhas-alvo de 3 mm usadas para ajustar um perfil periódico genérico.';
if(wave)root.querySelector('#eh-scope').textContent+=' Cada cor reúne trechos equivalentes de vários ciclos do perfil; não são ordens. A periferia é somada separadamente. A intensidade depende do quadrado da amplitude da soma.';
}
function stop(){cancelAnimationFrame(raf);raf=0;play.textContent='Animar dois ciclos';}
function save(){window.openai?.setWidgetState({modelContent:{comparacao:kind.value,pupila_mm:+pupil.value,vista:view.value,ponto:+point.value},privateContent:{log:log.checked,instante:+time.value,diferenca:root.querySelector('#eh-diff-toggle').checked}}).catch(()=>{});}
[kind,pupil,view,point,log,root.querySelector('#eh-diff-toggle')].forEach(e=>e.addEventListener('change',()=>{stop();draw();save();}));time.addEventListener('input',()=>{stop();draw();});time.addEventListener('change',save);play.addEventListener('click',()=>{if(raf){stop();save();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){time.value=(+time.value+.25)%1;draw();save();return;}const start=performance.now(),initial=+time.value;play.textContent='Pausar';function tick(now){const t=(now-start)/4000;time.value=(initial+t)%1;draw();if(t<2)raf=requestAnimationFrame(tick);else{stop();save();}}raf=requestAnimationFrame(tick);});
function restore(st){const m=st?.modelContent,p=st?.privateContent;if(['phase','zone','gemetric','trifocal'].includes(m?.comparacao))kind.value=m.comparacao;if([3,5].includes(m?.pupila_mm))pupil.value=m.pupila_mm;if(['retina','full','waves'].includes(m?.vista))view.value=m.vista;if([0,1].includes(m?.ponto))point.value=m.ponto;if(typeof p?.log==='boolean')log.checked=p.log;if(typeof p?.diferenca==='boolean')root.querySelector('#eh-diff-toggle').checked=p.diferenca;if(typeof p?.instante==='number')time.value=p.instante;draw();}window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));restore(window.openai?.widgetState);
await Promise.all([...Object.entries(D.images).map(([key,data])=>[key,data,pixels]),...Object.entries(D.difference).map(([key,data])=>[key,data,differencePixels])].map(([key,data,store])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=D.size;const ctx=c.getContext('2d');ctx.drawImage(im,0,0);const v=ctx.getImageData(0,0,D.size,D.size).data;store[key]=Uint8Array.from({length:D.size*D.size},(_,j)=>v[4*j]);resolve();};im.onerror=reject;im.src='data:image/png;base64,'+data;})));ready=true;new ResizeObserver(draw).observe(root.querySelector('.eh-pair'));draw();
})();

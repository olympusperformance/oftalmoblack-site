<h3>O mesmo campo: interferência e formação dos focos</h3>
<div class="viz-controls">
<label class="form-label">Sistema<select class="form-select" id="wl-system"><option value="young" selected>Dupla fenda de Young</option><option value="plate">Placa de zonas · amplitude</option><option value="refr">Lente refrativa ideal</option><option value="diff">Lente difrativa ideal · 2π</option><option value="hybrid">Lente refrativa-difrativa · bifocal</option></select></label>
<label class="form-label">Representação<select class="form-select" id="wl-view"><option value="intensity">Intensidade · focos e franjas</option><option value="field">Campo instantâneo · cristas e vales</option><option value="surface" selected>Campo em 3D · recorte ampliado</option><option value="parts">Contribuições em P · soma das ondas</option><option value="orders">Ordens · esquema dos caminhos</option></select></label>
</div>
<label class="form-label" for="wl-z">P no eixo: <span id="wl-z-value" class="tabular-nums"></span> × distância de referência</label>
<input type="range" class="form-range" id="wl-z" min="0.45" max="1.6" step="0.005" value="1">
<div id="wl-order-controls" hidden>
<div class="viz-row" style="margin:8px 0"><label class="form-check"><input type="checkbox" class="form-check-input" data-order="0" checked><span class="form-check-label">Ordem 0</span></label><label class="form-check"><input type="checkbox" class="form-check-input" data-order="1" checked><span class="form-check-label">Ordem +1</span></label><label class="form-check"><input type="checkbox" class="form-check-input" data-order="2"><span class="form-check-label">Ordem +2</span></label><label class="form-check"><input type="checkbox" class="form-check-input" data-order="3"><span class="form-check-label">Ordem +3</span></label></div>
</div>
<label class="form-check" id="wl-base-control"><input type="checkbox" class="form-check-input" id="wl-base" checked><span class="form-check-label">Incluir a base refrativa</span></label>
<div id="wl-surface-controls" class="viz-controls" style="gap:24px">
<label class="form-label">Altura visual <span id="wl-height-value">1,3×</span><input id="wl-height" class="form-range" type="range" min="0.6" max="1.8" step="0.1" value="1.3"></label>
<label class="form-label">Largura do recorte <span id="wl-cycles-value">8 λ</span><input id="wl-cycles" class="form-range" type="range" min="5" max="14" step="1" value="8"></label></div>

<div id="wl-figure"></div>
<div id="wl-legend" class="text-small"></div>
<div id="wl-note" class="text-small" aria-live="polite" style="margin-top:8px"></div>

<div class="text-small" style="margin-top:10px">Campo: brilho normalizado por sistema; não compara eficiência. Ordens: esquema qualitativo em outra escala; as caixas não filtram o campo calculado. Modelo monocromático, sem réplica comercial.</div>
</div>

document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
function restore(st){const m=st?.modelContent;if(['young','plate','refr','diff','hybrid'].includes(m?.sistema))system.value=m.sistema;if(['intensity','field','parts','orders','surface'].includes(m?.vista))view.value=m.vista;if(typeof m?.distancia_relativa==='number'&&m.distancia_relativa>=.45&&m.distancia_relativa<=1.6)zs.value=m.distancia_relativa;if(typeof st?.privateContent?.instante==='number')ts.value=st.privateContent.instante;if(typeof st?.privateContent?.base==='boolean')root.querySelector('#wl-base').checked=st.privateContent.base;if(Array.isArray(st?.privateContent?.ordens))root.querySelectorAll('[data-order]').forEach(e=>e.checked=st.privateContent.ordens.includes(+e.dataset.order));draw();}
new ResizeObserver(draw).observe(figure);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));restore(window.openai?.widgetState);
})();

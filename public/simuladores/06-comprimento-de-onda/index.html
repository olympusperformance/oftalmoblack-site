<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprimento de onda e atraso</title><style>
:root{color-scheme:light;--background:#fff;--foreground:#17212a;--muted-foreground:#586570;--muted:#edf0f3;--border:#ccd3d9;--yellow:#f3b927;--viz-series-1:#1677b5;--viz-series-2:#d59b16;--viz-series-3:#8248ad;--viz-series-4:#178979;--viz-series-5:#ce594d;--viz-series-6:#697583;--viz-series-7:#a5673f;--viz-series-8:#3881a8}
*{box-sizing:border-box}body{margin:0 auto;max-width:1260px;padding:22px 32px 44px;font-family:Arial,Helvetica,sans-serif;color:var(--foreground);background:var(--background);font-size:16px;line-height:1.45}h1,h2,h3{line-height:1.15}h3{font-size:26px;margin:18px 0}a{color:#146aa0}select,button,input{font:inherit}select{padding:7px;border:1px solid var(--border);background:#fff;color:var(--foreground);border-radius:4px;max-width:100%}button{padding:8px 12px;border:1px solid var(--border);background:#f4f5f6;border-radius:4px;color:var(--foreground);cursor:pointer}.btn-primary{background:#174f74;color:#fff}.viz-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.form-label{display:block;font-size:14px;margin-bottom:5px}.form-range{width:100%;accent-color:#176d9f}.form-check{display:flex;align-items:center;gap:7px}.form-check-input{accent-color:#176d9f}.text-small{font-size:14px}.text-muted{color:var(--muted-foreground)}.tabular-nums{font-variant-numeric:tabular-nums}.aula-voltar{font-size:13px;margin-bottom:16px;display:block}svg text{font-family:Arial,Helvetica,sans-serif}
</style></head><body><a class="aula-voltar" href="/simuladores/">Voltar ao índice da aula</a><div id="phase-material">
<h3>O que muda dentro do material</h3>
<div class="viz-controls"><label class="form-label">Atrasos em três regiões<select class="form-select" id="pm-profile"><option value="refr">Refrativa · mantém o atraso completo</option><option value="diff">Difrativa · retira ciclos inteiros</option></select></label></div>
<div id="pm-figure"></div>
<div class="text-small">Linha colorida: campo elétrico · tracejado: referência sem material</div>
<label class="form-label" for="pm-time">Instante</label><input id="pm-time" class="form-range" type="range" min="0" max="1" step="0.01" value="0.25">
<button type="button" class="btn" id="pm-play">Animar dois ciclos</button>
<div class="text-small" style="margin-top:10px">Três percursos ampliados e separados · índice relativo ilustrativo 1,5 · mesma frequência</div>
</div>
<style>#phase-material svg{display:block;width:100%}#phase-material svg text{fill:var(--foreground);font-size:12px}</style>
<script>
(()=>{const root=document.getElementById('phase-material'),profile=root.querySelector('#pm-profile'),time=root.querySelector('#pm-time'),figure=root.querySelector('#pm-figure'),play=root.querySelector('#pm-play'),NS='http://www.w3.org/2000/svg';let raf=0;function el(tag,a={},text){const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}function draw(){const w=Math.max(300,figure.getBoundingClientRect().width),h=408,lam=(w-48)/18,a=24+lam*4,ratio=1.5,u=+time.value,svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'Três percursos: comprimento de onda menor apenas dentro do material; ao sair, o comprimento original retorna e a diferença de fase permanece.'});figure.replaceChildren(svg);const add=(tag,attrs,text)=>{const e=el(tag,attrs,text);svg.append(e);return e};const pth=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
[.3,1.4,2.5].forEach((full,i)=>{const d=profile.value==='refr'?full:full%1,thickness=d*lam/(ratio-1),cy=80+i*115,end=a+thickness;add('text',{x:12,y:cy-42},'Região '+String.fromCharCode(65+i));add('text',{x:w-12,y:cy-42,'text-anchor':'end'},'Atraso: '+d.toFixed(1).replace('.',',')+' ciclo(s)');add('rect',{x:a,y:cy-24,width:thickness,height:48,fill:'var(--muted)',stroke:'var(--muted-foreground)','stroke-width':1});const pts=[],ref=[];for(let j=0;j<=600;j++){const x=20+(w-40)*j/600,inside=Math.max(0,Math.min(x-a,thickness)),optical=(x-20)+(ratio-1)*inside;pts.push([x,cy-14*Math.sin(2*Math.PI*(u-optical/lam))]);if(x>end)ref.push([x,cy-14*Math.sin(2*Math.PI*(u-(x-20)/lam))]);}add('line',{x1:20,y1:cy,x2:w-20,y2:cy,stroke:'var(--border)'});add('path',{d:pth(ref),fill:'none',stroke:'var(--muted-foreground)','stroke-width':1,'stroke-dasharray':'3 4'});add('path',{d:pth(pts),fill:'none',stroke:'var(--viz-series-1)','stroke-width':2});if(i===2)add('text',{x:12,y:cy+55},'λ diminui no material e retorna ao sair.');});}
function stop(){cancelAnimationFrame(raf);raf=0;play.textContent='Animar dois ciclos';}function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{perfil:profile.value},privateContent:{instante:+time.value}}).catch(()=>{});}profile.addEventListener('change',()=>{stop();draw();save()});time.addEventListener('input',()=>{stop();draw()});time.addEventListener('change',save);play.addEventListener('click',()=>{if(raf){stop();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){time.value=(+time.value+.25)%1;draw();save();return;}const t0=performance.now(),initial=+time.value;play.textContent='Pausar';function tick(now){const t=(now-t0)/3500;time.value=(initial+t)%1;draw();if(t<2)raf=requestAnimationFrame(tick);else{stop();save();}}raf=requestAnimationFrame(tick);});function restore(st){if(['refr','diff'].includes(st?.modelContent?.perfil))profile.value=st.modelContent.perfil;const t=st?.privateContent?.instante;if(typeof t==='number'&&t>=0&&t<=1)time.value=t;draw();}new ResizeObserver(draw).observe(figure);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));restore(window.openai?.widgetState);})();
</script>
</body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zonas no espaço</title><style>
:root{color-scheme:light;--background:#fff;--foreground:#17212a;--muted-foreground:#586570;--muted:#edf0f3;--border:#ccd3d9;--yellow:#f3b927;--viz-series-1:#1677b5;--viz-series-2:#d59b16;--viz-series-3:#8248ad;--viz-series-4:#178979;--viz-series-5:#ce594d;--viz-series-6:#697583;--viz-series-7:#a5673f;--viz-series-8:#3881a8}
*{box-sizing:border-box}body{margin:0 auto;max-width:1260px;padding:22px 32px 44px;font-family:Arial,Helvetica,sans-serif;color:var(--foreground);background:var(--background);font-size:16px;line-height:1.45}h1,h2,h3{line-height:1.15}h3{font-size:26px;margin:18px 0}a{color:#146aa0}select,button,input{font:inherit}select{padding:7px;border:1px solid var(--border);background:#fff;color:var(--foreground);border-radius:4px;max-width:100%}button{padding:8px 12px;border:1px solid var(--border);background:#f4f5f6;border-radius:4px;color:var(--foreground);cursor:pointer}.btn-primary{background:#174f74;color:#fff}.viz-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.form-label{display:block;font-size:14px;margin-bottom:5px}.form-range{width:100%;accent-color:#176d9f}.form-check{display:flex;align-items:center;gap:7px}.form-check-input{accent-color:#176d9f}.text-small{font-size:14px}.text-muted{color:var(--muted-foreground)}.tabular-nums{font-variant-numeric:tabular-nums}.aula-voltar{font-size:13px;margin-bottom:16px;display:block}svg text{font-family:Arial,Helvetica,sans-serif}

#fz-space .viz-controls{gap:12px 20px;align-items:end}
#fz-space .form-label{margin:0}#fz-space .form-label select{display:block;margin-top:5px}
#fz-space .fz-transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
#fz-space .fz-phase{flex:1;min-width:200px}#fz-space .fz-phase label{display:flex;justify-content:space-between;gap:12px}
#fz-space .fz-phase input{display:block;margin:6px 0 0}
#fz-space button:focus-visible,#fz-space select:focus-visible,#fz-space input:focus-visible{outline:3px solid var(--viz-series-1);outline-offset:3px}
#fz-space button:disabled{opacity:.55;cursor:default}
#fz-space .fz-plots{display:grid;grid-template-columns:minmax(175px,.28fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
#fz-space figure{margin:0;min-width:0}#fz-space figcaption{font-size:14px;min-height:44px;line-height:1.4;margin-bottom:7px}
#fz-space canvas{width:100%;display:block;background:var(--background)}#fz-space .fz-note{font-size:14px;color:var(--muted-foreground);margin-top:8px}
#fz-space .fz-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:12px 0}
#fz-space .fz-model-note{font-size:14px;margin-top:12px}
@media(max-width:700px){body{padding:16px}#fz-space .fz-plots{grid-template-columns:1fr}#fz-space .fz-overview{max-width:260px}#fz-space figcaption{min-height:0}#fz-space .fz-controls{gap:10px}h3{font-size:23px}}

</style></head><body><a class="aula-voltar" href="/simuladores/">Voltar ao índice da aula</a><div id="fz-space">
<h3>Ondas depois da placa · vista de lado</h3>
<div class="viz-controls">
<label class="form-label" for="fz-zones">Regiões abertas<select id="fz-zones"><option value="0">Somente a zona 1 central</option><option value="1">Somente a zona 3 anular</option><option value="2" selected>Zonas 1, 3, 5, 7 e 9 juntas</option></select></label>
<label class="form-label" for="fz-show">Mostrar<select id="fz-show"><option value="wave" selected>Cristas e vales do campo</option><option value="light">Intensidade da luz</option></select></label>
<label class="form-label" for="fz-view">Enquadramento<select id="fz-view"><option value="crop" selected>Ampliado 6× · perto de F</option><option value="general">Visão geral · placa até F</option></select></label>
</div>
<div class="fz-transport">
<button type="button" class="btn-primary" id="fz-play" aria-pressed="true">Pausar</button>
<button type="button" id="fz-step">Avançar ¼ de ciclo</button>
<div class="fz-phase"><label class="form-label" for="fz-time"><span>Instante dentro de um ciclo</span><output id="fz-phase-label" for="fz-time">0%</output></label><input class="form-range" id="fz-time" type="range" min="0" max="1" value="0" step="0.001"></div>
</div>
<div id="fz-status" class="fz-note">Movimento contínuo e lento · 7 segundos por ciclo.</div>
<div class="fz-plots">
<figure class="fz-overview"><figcaption>Visão geral de referência<br>Placa à esquerda → F</figcaption><canvas id="fz-overview" role="img" aria-label="Visão geral da placa à esquerda e do foco F. Um retângulo tracejado localiza o recorte ampliado."></canvas><div class="fz-note">Tracejado = área ampliada.</div></figure>
<figure class="fz-detail"><figcaption id="fz-view-label">Recorte ampliado 6× · 10 comprimentos de onda · F no centro</figcaption><canvas id="fz-canvas" role="img" aria-label="Recorte ampliado do campo ondulatório perto de F, com dez comprimentos de onda na horizontal. As cores mostram o campo, não trajetórias de raios."></canvas></figure>
</div>
<div class="fz-legend" id="fz-legend"></div>
<div class="fz-model-note">Campo ondulatório ≠ trajetória de um raio. O recorte amplia a visualização; não altera o comprimento de onda nem os dados.</div>
<div class="fz-note">Placa de amplitude · luz monocromática · contraste ampliado</div>
</div>

<script>

(()=>{

const root=document.getElementById('fz-space'),canvas=root.querySelector('#fz-canvas'),ctx=canvas.getContext('2d'),overview=root.querySelector('#fz-overview'),ox=overview.getContext('2d'),zones=root.querySelector('#fz-zones'),show=root.querySelector('#fz-show'),view=root.querySelector('#fz-view'),time=root.querySelector('#fz-time'),play=root.querySelector('#fz-play'),step=root.querySelector('#fz-step'),legend=root.querySelector('#fz-legend'),phaseLabel=root.querySelector('#fz-phase-label'),viewLabel=root.querySelector('#fz-view-label'),status=root.querySelector('#fz-status');

const DOMAIN={x0:.25,x1:60.25,y0:-24,y1:24},FOCUS=40,CYCLE_MS=7000,IS_PHASE=false,INTENSITY_LIMIT=36;

const off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d'),im=oc.createImageData(W,H);
function rgb(token){const el=document.createElement('span');el.style.color='var('+token+')';root.append(el);const c=getComputedStyle(el).color;el.remove();const tmp=document.createElement('canvas');tmp.width=tmp.height=1;const cctx=tmp.getContext('2d');cctx.fillStyle=c;cctx.fillRect(0,0,1,1);return Array.from(cctx.getImageData(0,0,1,1).data).slice(0,3);}
function palette(){colors={bg:rgb('--background'),pos:rgb('--viz-series-1'),neg:rgb('--viz-series-2'),fg:rgb('--foreground'),reference:rgb('--viz-series-4')};}
function css(c){return 'rgb('+c.join(',')+')';}
function surface(el,c,width,height){const dpr=devicePixelRatio||1,w=Math.max(1,Math.round(width)),h=Math.max(1,Math.round(height));if(el.width!==Math.round(w*dpr)||el.height!==Math.round(h*dpr)){el.width=Math.round(w*dpr);el.height=Math.round(h*dpr);el.style.height=h+'px';}c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return {w,h};}

function draw(){if(!colors)palette();paintField();const mw=Math.max(230,canvas.parentElement.getBoundingClientRect().width),mh=Math.max(255,Math.min(520,Math.round(mw*.7))),main=surface(canvas,ctx,mw,mh);const crop=view.value==='crop'?{x0:35,x1:45,y0:-4,y1:4}:null,b=crop||DOMAIN,scale=Math.min((main.w-10)/(b.x1-b.x0),main.h/(b.y1-b.y0)),fw=(b.x1-b.x0)*scale,fh=(b.y1-b.y0)*scale,left=(main.w-fw)/2,top=(main.h-fh)/2;ctx.save();ctx.translate(left,top);field(ctx,fw,fh,b);if(!crop)plate(ctx,-7,0,fh);ctx.restore();viewLabel.textContent=crop?'Recorte ampliado 6× · 10 comprimentos de onda · F no centro':'Visão geral · placa e região de foco · 60 comprimentos de onda';
const ow=Math.max(175,overview.parentElement.getBoundingClientRect().width),oh=Math.round((ow-8)*.8),small=surface(overview,ox,ow,oh);ox.save();ox.translate(8,0);const p=field(ox,small.w-8,small.h,DOMAIN);plate(ox,-7,0,small.h);if(crop){ox.strokeStyle=css(colors.reference);ox.lineWidth=2;ox.setLineDash([4,3]);ox.strokeRect(p.x(crop.x0),p.y(crop.y1),p.x(crop.x1)-p.x(crop.x0),p.y(crop.y0)-p.y(crop.y1));ox.setLineDash([]);}ox.restore();time.value=phase;phaseLabel.textContent=Math.round(phase*100)+'%';}
function updateControls(){const intensity=show.value==='light';time.disabled=intensity;play.disabled=intensity;step.disabled=intensity;play.textContent=playing&&!intensity?'Pausar':'Reproduzir';play.setAttribute('aria-pressed',String(playing&&!intensity));status.textContent=intensity?'Intensidade estacionária · mesma escala de cor entre as placas.':'Movimento contínuo e lento · 7 segundos por ciclo.';legend.innerHTML=intensity?'<span>Mais cor = mais intensidade · escala comum, sem renormalizar cada placa</span>':'<span style="color:var(--viz-series-1)">● Crista (+)</span><span style="color:var(--viz-series-2)">● Vale (−)</span><span>Mesma escala do campo entre situações</span>';}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{zonas:+zones.value,mostrar:show.value,visao:view.value},privateContent:{instante:phase,animando:playing}}).catch(()=>{});}
function stop(){cancelAnimationFrame(raf);raf=0;lastFrame=0;}
function schedule(){stop();if(!playing||show.value==='light'||document.hidden)return;function tick(now){if(lastFrame){phase=(phase+Math.min(100,now-lastFrame)/CYCLE_MS)%1;draw();}lastFrame=now;raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);}
zones.addEventListener('change',()=>{draw();save();});view.addEventListener('change',()=>{draw();save();});show.addEventListener('change',()=>{updateControls();draw();schedule();save();});time.addEventListener('input',()=>{playing=false;stop();phase=Number(time.value)%1;updateControls();draw();});time.addEventListener('change',save);
play.addEventListener('click',()=>{playing=!playing;updateControls();schedule();save();});step.addEventListener('click',()=>{playing=false;stop();phase=(phase+.25)%1;updateControls();draw();save();});document.addEventListener('visibilitychange',schedule);
function restore(s){const m=s?.modelContent,p=s?.privateContent;if([0,1,2].includes(m?.zonas))zones.value=m.zonas;if(['wave','light'].includes(m?.mostrar))show.value=m.mostrar;if(['crop','general'].includes(m?.visao))view.value=m.visao;if(typeof p?.instante==='number'&&Number.isFinite(p.instante))phase=((p.instante%1)+1)%1;if(typeof p?.animando==='boolean')playing=p.animando;updateControls();draw();schedule();}

})();

<script>
(function(){
  var WA = "https://wa.me/5549991886635?text=Ol%C3%A1%21%20Vim%20pelo%20link%20da%20bio%20do%20Dr.%20Eduardo%20Menta%20Vidal%20e%20gostaria%20de%20agendar%20uma%20consulta.";

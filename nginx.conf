server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O EasyPanel termina o TLS no Traefik; aqui dentro o tráfego é HTTP.
    # Não force HTTPS neste bloco ou o redirect entra em loop.

    # Como o tráfego interno é HTTP, um Location absoluto sairia como
    # http://... — o que derruba o visitante de HTTPS ao acessar uma rota sem
    # barra final (ex.: /agendamento/cintiasantini). Location relativo preserva
    # o esquema que o visitante já estava usando.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets têm nome estável, então cache longo exige invalidação por rename.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # config.js é gerado no boot a partir das variáveis de ambiente — cachear
    # significaria servir credenciais antigas depois de um redeploy.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Área de membros: HTML e JS mudam a cada ajuste e os nomes são estáveis,
    # então aqui o cache longo de /assets/ atrapalharia. Regex ganha do prefixo.
    location ~ ^/assets/(club|admin|membros|tv)[a-z-]*\.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ ^/(entrar|admin|membros|demandas)/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Página da Imersão Grau Zero (/imersaograuzero/) — HTML sempre revalidado,
    # vídeos com cache longo: são grandes e o nome é estável.
    location = /imersaograuzero/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /imersaograuzero/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Link da bio da Dra. Cintia Santini (/agendamento/cintiasantini/). Traz
    # preço em tela, então o HTML não pode ficar preso em cache do navegador.
    #
    # Os três headers de segurança estão repetidos aqui de propósito: o nginx só
    # herda os add_header do nível de cima quando o bloco atual não tem nenhum.
    # Sem repetir, este HTML sairia sem eles.
    location = /agendamento/cintiasantini/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
